name: Build APK and AAB (Google Play Store)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Environment Secrets Files
        run: |
          echo 'GEMINI_API_KEY=""' > .env.example
          echo 'GEMINI_API_KEY=""' > .env

      - name: Prepare Signing Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'jammasjid123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jammasjid123' }}
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            echo "Generating automated release signing keystore..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=GecckoCreator, OU=JamMasjid, O=JamMasjid, L=Kediri, ST=JawaTimur, C=ID"
          else
            echo "Release keystore my-upload-key.jks already exists."
          fi

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating with gradle wrapper..."
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Build Android App Bundle (AAB for Google Play Store)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'jammasjid123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jammasjid123' }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'jammasjid123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jammasjid123' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload Release AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: JamMasjid-PlayStore-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: JamMasjid-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Keystore Backup (Simpan untuk Update Aplikasi Mendatang)
        uses: actions/upload-artifact@v4
        with:
          name: JamMasjid-Upload-Keystore
          path: my-upload-key.jks
          retention-days: 90
